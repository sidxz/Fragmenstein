# GitLab CI for Fragmenstein — builds backend & frontend images
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   CI_REGISTRY          — gitlab-registry.snet.biobio.tamu.edu
#   CI_REGISTRY_USER     — GitLab username
#   CI_REGISTRY_PASSWORD — personal access token with registry scope

image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_DRIVER: overlay2
  REGISTRY: "$CI_REGISTRY/sid/fragmenstein"

before_script:
  - docker info
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

stages:
  - build
  - push

build-backend:
  stage: build
  script:
    - docker build -t "$REGISTRY/backend:$CI_COMMIT_REF_NAME" web/backend
  only:
    - main
    - tags

build-frontend:
  stage: build
  script:
    - >
      docker build
      --build-arg NEXT_PUBLIC_API_URL=https://fragmenstein.snet.biobio.tamu.edu
      -t "$REGISTRY/frontend:$CI_COMMIT_REF_NAME"
      web/frontend
  only:
    - main
    - tags

push-backend:
  stage: push
  script:
    - docker push "$REGISTRY/backend:$CI_COMMIT_REF_NAME"
  only:
    - main
    - tags

push-frontend:
  stage: push
  script:
    - docker push "$REGISTRY/frontend:$CI_COMMIT_REF_NAME"
  only:
    - main
    - tags
